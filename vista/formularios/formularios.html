<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="../estilo/estilo.css">
	<title>	Formularios</title>
</head>
<body>
	<div class="contenedor-con-fondo">
	<div class="form-container">
        <h1>Formulario de Contacto</h1>
        <br>
        <form id="contactForm">
            <div class="form-group">
                <label for="nombre" class="required">Nombre y Apellido</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
            </div>
            <br>
            <div class="form-group">
                <label for="email" class="required">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>
            <br>
            <div class="form-group">
                <label for="telefono">Número de Celular</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+54 9 11 1234-5678">
            </div>
            <br>
            <div class="form-group">
                <label for="consulta" class="required">Consulta</label>
                <textarea id="consulta" name="consulta" required placeholder="Escribe tu consulta aquí..."></textarea>
            </div>
            <br>
            <button type="submit" class="btn-enviar">Enviar Consulta</button>
        </form>
        </div>
  <br> 
<a href="../../index.html"><button type="button">"Volver a la página principal"</a>
</body>
</html>
